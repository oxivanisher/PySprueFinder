{% extends "base.html" %}
{% block title %}{% if project %}Edit{% else %}New{% endif %} Project — PySprueFinder{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <a href="/admin" class="text-sm text-slate-500 dark:text-slate-400 hover:text-amber-500">&larr; Dashboard</a>
  <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-2 mb-6">
    {% if project %}Edit Project{% else %}New Project{% endif %}
  </h1>

  {% if error %}
    <div class="mb-4 p-3 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 rounded-lg text-sm">
      {{ error }}
    </div>
  {% endif %}

  <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-6">
    <form method="post">
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1" for="name">Project Name</label>
      <input
        type="text"
        id="name"
        name="name"
        value="{{ project.name if project else '' }}"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 mb-4"
        autofocus
        required
      >
      <button
        type="submit"
        class="w-full py-2 bg-amber-500 text-white font-semibold rounded-lg hover:bg-amber-600"
      >
        {% if project %}Save Changes{% else %}Create Project{% endif %}
      </button>
    </form>
  </div>
</div>
{% endblock %}
