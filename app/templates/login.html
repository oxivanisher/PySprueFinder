{% extends "base.html" %}
{% block title %}Admin Login — PySprueFinder{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-6 text-center">Admin Login</h1>

    {% if error %}
      <div class="mb-4 p-3 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 rounded-lg text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/login">
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-1" for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 mb-4"
        autofocus
        required
      >
      <button
        type="submit"
        class="w-full py-2 bg-amber-500 text-white font-semibold rounded-lg hover:bg-amber-600 transition"
      >
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
