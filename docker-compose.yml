---
# if pulling is not working, check the registry
# Username: REDACTED
# Password: REDACTED
# URL: https://gitlab.example.com:5050

services:
  spruefinder:
    image: gitlab.example.com:5050/example/pyspruefinder/spruefinder
    container_name: spruefinder
    environment:
      - ADMIN_PASSWORD=changeme
      - SECRET_KEY=REDACTED
      - DATABASE_URL=sqlite:///./instance/spruefinder.db
      - UPLOAD_DIR=./uploads
    volumes:
      - /srv/spruefinder/uploads/:/app/uploads
      - /srv/spruefinder/instance/:/app/instance
    ports:
      - "0.0.0.0:8000:8000"

    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local

networks:
  default:
